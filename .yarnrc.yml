approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @pixi/layout depends (optionally) on @pixi/react for its `/react` entry, but does not pass React
# on to it: declared here as optional peers, its @pixi/react uses the workspace's own React.
packageExtensions:
  "@pixi/layout@*":
    peerDependencies:
      "@types/react": "*"
      react: ">=19.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      react:
        optional: true
